[project]
name = "nativagpt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core dependencies
    "requests~=2.28.0",
    "torch>=2.0.0",
    "flask~=2.3.0",
    "Flask-Cors~=4.0.0",
    "transformers>=4.36.0",
    "qdrant-client>=1.1.0,<1.8.0",
    "opencv-python>=4.5.0,<4.9.0",
    "Pillow>=9.0.0",
    "pyautogui>=0.9.50,<0.10.0",
    "paho-mqtt>=1.5.0,<2.0.0",
    "pynput>=1.7.0,<1.8.0",
    "python-dateutil>=2.8.0",
    "packaging>=20.0",
    "ollama",
    "mcp",
    "python-dotenv",
    "bytez",
    "ffmpeg>=1.4",
    "path>=17.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell hatchling where your package is
[tool.hatch.build.targets.wheel]
packages = ["NativaGPT"]

# Fix the deprecated dev-dependencies warning
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the default rule set (E/F) - this is a first pass at linting for a
# large, previously-unlinted codebase, not a strict style enforcement.
select = ["E", "F"]
# Long setup-prompt / SQL-like strings and dynamically generated bridge
# scripts (see NativaGPT/lib/mcp/mcp_server_ros.py) legitimately exceed the
# line-length limit; don't fail CI over those pre-existing lines.
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
