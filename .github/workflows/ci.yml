name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff black

      - name: Import check
        run: python -c "import NativaGPT"

      - name: Run smoke tests
        run: pytest tests/ -v

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .
